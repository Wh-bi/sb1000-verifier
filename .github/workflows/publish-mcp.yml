name: Publish to MCP Registry

# ★ 2026-10-13：把我们的 MCP 服务器发布到官方 MCP 注册表
#   v1.0.0 首次运行：OIDC 认证成功，但 publish 失败（日志需登录才能看）
#   ⇒ 本版加了**自诊断**（把失败原因打到 Actions 日志里，公开可见）
#
# 【为什么走这条路】
#   今天实测：SkillHub / Edge 商店 / AgentPay / 网站 —— 四个平台都不给我们陌生人曝光
#   （Edge：32 个扩展、4 个月、0 展示）。而 MCP 官方注册表是**索引型渠道**
#   （公开搜索 API /v0/servers，不靠推荐算法）。
#   我们的 MCP 端点 https://mcp.wanhetools.top/mcp 已实测可用（2 个工具）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show server.json
        run: cat server.json

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          URL="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz"
          echo "::group::download $URL"
          curl -fsSL "$URL" | tar xz mcp-publisher
          echo "::endgroup::"
          ls -la mcp-publisher
          ./mcp-publisher --help 2>&1 | head -40 || true

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json (dry run)
        run: ./mcp-publisher publish --dry-run 2>&1 || true

      - name: Publish server to MCP Registry
        run: |
          set -x
          ./mcp-publisher publish 2>&1 | tee /tmp/publish.log
          echo "exit=$?"
          echo "::group::publish.log"
          cat /tmp/publish.log
          echo "::endgroup::"

      - name: Post-fail diagnostics
        if: failure()
        run: |
          echo "=== 诊断：注册表是否已收录我们 ==="
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=ai-content-compliance" | head -c 2000 || true
          echo
          echo "=== 诊断：server.json 内容 ==="
          cat server.json
